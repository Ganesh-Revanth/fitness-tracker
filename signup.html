<!DOCTYPE html>
<html>
    <head>
        <title>Log In | Fitness Tracker</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mozilla+Text:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/favicon.png">
    </head>
    
    <body>
        <nav class="navabar">
            <div class="logo"><a href="index.html"><img src="assets/logo.png" class="logo_img" alt="FT26"></a></div>

            <ul class="nav-links">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="#">Workouts</a></li>
                <li><a href="#">Records</a></li>
            </ul>
            <div class="btns">
                <input class="btn" type="button" onclick="location.href='login.html';" value="LOG IN" />
                <input class="btn" type="button" onclick="location.href='signup.html';" value="SIGN UP" />
            </div>
            
        </nav>
        <div class="login_cnt">
            <div class="side1">
                <img src="assets/Arnold Conquer.jpg">
                <img src="assets/dominate.png">
            </div>
            <div class="login_form">
                <h2>Welcome Back!</h2>
                <form id="signup-form">
                    <div class="input_field">
                        <label>First Name:</label><br>
                        <input type="text" id="firstName" placeholder="Enter your first name" required>
                    </div>
                    <div class="input_field">
                        <label>Last Name:</label><br>
                        <input type="text" id="lastName" placeholder="Enter your last name" required>
                    </div>
                    <div class="input_field">
                        <label>Email:</label><br>
                        <input type="email" id="signup-email" placeholder="Enter your email" required>
                    </div>
                    <div class="input_field">
                        <label>Password:</label><br>
                        <input type="password" id="signup-password" placeholder="Enter your password" required>
                    </div>
                    <div class="input_field">
                        <label>Birthdate:</label><br>
                        <input type="date" id="birthdate" placeholder="Enter your birthdate" required>
                    </div>
                    <div class="input_field">
                        <label>Gender:</label><br>
                        <select id="signup-gender">
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Others/Prefer not to say</option>
                        </select>
                    </div>
                    <div class="input_field">
                        <label>Weight:</label><br>
                        <input type="number" id="weight" placeholder="Enter your  weight (kg)" required>
                    </div>
                    <div class="input_field">
                        <label>Height:</label><br>
                        <input type="text" id="height" placeholder="Enter your  height (cm)" required>
                    </div>
                    <div class="signup-btn">
                        <button class="log_btn" id="signup-btn" type="submit">Sign Up</button>
                    </div>
                </form>
                
                <p class="login_footer">
                    Don't have an account? <a href="signup.html">Sign Up</a>
                </p>
                
            </div>
            <div class="side2">
                <img src="assets/kratos_r.jpg" class="kratos">

            </div>
            
        </div>
        <footer class="footer">
            <div class="footer_content">
                <div class="footer_sec">
                    <h3>Fitness Tracker</h3>
                    <p>Building a better version of ourselves.</p>
                </div>
            </div>
            <div class="footer_bottom">
                 &copy; <span data-current-year></span> Fitness Tracker -- Designed &amp; Developed by <a href="https://github.com/Ganesh-Revanth">Ganesh Revanth</a>
            </div>
        </footer>
        <script type="module" src="signup.js"></script>
    </body>
</html>
